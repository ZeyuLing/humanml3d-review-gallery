    $("#search").addEventListener("input",applyFilter);$("#case-select").addEventListener("change",event=>choose(filtered.indexOf(Number(event.target.value))));$("#previous").addEventListener("click",()=>choose(selected-1));$("#next").addEventListener("click",()=>choose(selected+1));$("#play").addEventListener("click",()=>{if(!audio.hidden){if(audio.paused){if(audio.currentTime>=audioEnd-1e-3){audio.currentTime=audioStart;frame=0;updateAll()}audio.play();playing=true}else{audio.pause();playing=false}}else{playing=!playing;lastTime=performance.now();}$("#play").textContent=playing?"Ⅱ":"▶"});$("#timeline").addEventListener("input",event=>{frame=Number(event.target.value);lastTime=performance.now();if(!audio.hidden)audio.currentTime=audioStart+frame/playbackFps();updateAll()});audio.addEventListener("play",()=>{playing=true;$("#play").textContent="Ⅱ"});audio.addEventListener("pause",()=>{playing=false;$("#play").textContent="▶"});audio.addEventListener("ended",()=>{frame=maxFrames-1;updateAll()});addEventListener("resize",renderViews);main.addEventListener("scroll",updateAll,{passive:true});
    init().catch(error=>{loading.hidden=false;loading.textContent=error.message;console.error(error)});
  </script>
